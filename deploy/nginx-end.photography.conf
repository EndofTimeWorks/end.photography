server {
    listen 8082;
    listen [::]:8082;

    server_name _;
    root /var/www/end.photography;
    index index.html;

    location ^~ /admin/ {
        auth_basic "End Photography Admin";
        auth_basic_user_file /etc/nginx/end.photography.htpasswd;
        client_max_body_size 4097m;

        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /photos/ {
        auth_basic "End Photography Preview";
        auth_basic_user_file /etc/nginx/end.photography.htpasswd;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "private";
    }

    location = /data/gallery.json {
        auth_basic "End Photography Preview";
        auth_basic_user_file /etc/nginx/end.photography.htpasswd;
        try_files $uri =404;
        add_header Cache-Control "private, no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|avif|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }
}
